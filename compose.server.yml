name: micromarket-server

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-db-env: &db-env
  POSTGRES_DB: ${POSTGRES_DB:?Run scripts/init_server.py}
  POSTGRES_USER: ${POSTGRES_USER:?Run scripts/init_server.py}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/init_server.py}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  web:
    build: .
    restart: unless-stopped
    init: true
    environment:
      <<: *db-env
      POSTGRES_HOST: db
      MMC_ENV: production
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Run scripts/init_server.py}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set allowed hosts}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set HTTPS origins}
      TIME_ZONE: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
      - /app/staticfiles:uid=10001,gid=10001,mode=0755
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    logging: *logging

  proxy:
    image: nginx:stable-alpine
    restart: unless-stopped
    # Only the host loopback is exposed. No public deployment by default.
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    networks: [backend, edge]
    depends_on:
      web:
        condition: service_healthy
    logging: *logging

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: *db-env
    volumes:
      - ./deploy/backup.sh:/opt/backup.sh:ro
      - ./backups:/backups
    command: ["/bin/sh", "/opt/backup.sh", "loop"]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /backups -name '*.dump' -mmin -1500 -print -quit)\""]
      interval: 5m
      timeout: 10s
      start_period: 5m
      retries: 1

networks:
  backend:
    internal: true
  edge:

volumes:
  pgdata:

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: micromarket
      POSTGRES_USER: micromarket
      POSTGRES_PASSWORD: micromarket-local-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U micromarket"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    environment:
      DJANGO_SECRET_KEY: local-docker-key-change-for-production
      DJANGO_DEBUG: "1"
      RUN_LOCAL_MIGRATIONS: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql://micromarket:micromarket-local-only@db:5432/micromarket
      TIME_ZONE: Europe/Moscow
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

volumes:
  postgres_data:
